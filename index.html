<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>军棋翻翻棋 - 双人对弈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: #fff;
        }
        
        h1 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 22px;
        }
        
        .game-info {
            background: rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .current-player {
            font-size: 1.1em;
            font-weight: bold;
            color: #ffd700;
        }
        
        /* 标准军棋棋盘容器 */
        .board-container {
            background: linear-gradient(180deg, #8B7355 0%, #6B5345 100%);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 3px solid #4a3728;
        }
        
        /* 标准军棋棋盘：5 行 12 列 */
        .board {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 1px;
            background: #5a4635;
            padding: 2px;
            border-radius: 4px;
        }
        
        .cell {
            width: 36px;
            height: 36px;
            min-width: 36px;
            min-height: 36px;
            background: #c2b280;
            border: 1px solid #8b7355;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
            position: relative;
        }
        
        /* 铁路线 - 上下两行，中间有连线 */
        .cell.railway {
            background: linear-gradient(90deg, #d4c4a8 0%, #e8dcc8 50%, #d4c4a8 100%);
            border: 1px dashed #8b7355;
        }
        
        /* 铁路线中间部分（工兵可以拐弯）*/
        .cell.railway-center {
            background: linear-gradient(90deg, #d4c4a8 0%, #e8dcc8 50%, #d4c4a8 100%);
            position: relative;
        }
        
        .cell.railway-center::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #8b7355;
            transform: translateY(-50%);
        }
        
        /* 行营 - 圆形安全区 */
        .cell.camp {
            background: #a8c8a8;
            border-radius: 50%;
            border: 2px solid #5a8b5a;
            width: 32px;
            height: 32px;
            min-width: 32px;
            min-height: 32px;
            margin: 2px;
        }
        
        /* 大本营 - 军旗位置 */
        .cell.base {
            background: #b8a888;
            border: 2px solid #8b7355;
            position: relative;
        }
        
        .cell.base::after {
            content: '★';
            position: absolute;
            font-size: 10px;
            color: #6b5345;
            top: 2px;
            right: 2px;
        }
        
        /* 山地 - 不能通行 */
        .cell.mountain {
            background: #6b7b5a;
            border: 1px solid #4a5b3a;
        }
        
        .cell.mountain::after {
            content: '⛰';
            font-size: 16px;
            color: #4a5b3a;
        }
        
        .cell:hover {
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            z-index: 10;
        }
        
        .cell.red {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a) !important;
            color: white;
            border-color: #cc0000;
        }
        
        .cell.blue {
            background: linear-gradient(135deg, #4a90d9, #357abd) !important;
            color: white;
            border-color: #0066cc;
        }
        
        .cell.back {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: transparent;
            border-color: #654321;
        }
        
        .cell.back::after {
            content: '军';
            color: rgba(255,255,255,0.3);
            font-size: 16px;
        }
        
        .cell.selected {
            box-shadow: 0 0 15px #ffd700;
            transform: scale(1.15);
            z-index: 20;
            border: 3px solid #ffd700;
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245,87,108,0.4);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 380px;
            margin: 20px;
        }
        
        .modal h2 {
            margin-bottom: 15px;
            color: #ffd700;
            font-size: 20px;
        }
        
        .share-link {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
        }
        
        @media (max-width: 500px) {
            .cell {
                width: 28px;
                height: 28px;
                min-width: 28px;
                min-height: 28px;
                font-size: 12px;
            }
            
            .cell.camp {
                width: 24px;
                height: 24px;
                min-width: 24px;
                min-height: 24px;
            }
            
            .board-container {
                padding: 8px;
            }
            
            h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <h1>🎖️ 军棋翻翻棋</h1>
    
    <div class="game-info">
        <div class="current-player" id="currentPlayer">点击棋子开始游戏</div>
    </div>
    
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>
    
    <div class="controls">
        <button class="btn-primary" onclick="newGame()">新游戏</button>
        <button class="btn-secondary" onclick="showShareModal()">分享</button>
        <button class="btn-primary" onclick="showRules()">规则</button>
    </div>
    
    <!-- 分享模态框 -->
    <div class="modal" id="shareModal">
        <div class="modal-content">
            <h2>🎮 邀请好友</h2>
            <p>复制链接发送给 QQ 好友：</p>
            <div class="share-link" id="shareLink"></div>
            <button class="btn-primary" onclick="copyLink()">复制</button>
            <button class="btn-secondary" onclick="closeModal('shareModal')">关闭</button>
        </div>
    </div>
    
    <!-- 规则模态框 -->
    <div class="modal" id="rulesModal">
        <div class="modal-content">
            <h2>📜 游戏规则</h2>
            <p><strong>棋盘说明：</strong></p>
            <p>🛤 铁路线：上下两行，工兵可任意移动</p>
            <p>⭕ 行营：圆形安全区，8 个位置</p>
            <p>⭐ 大本营：军旗必须放在这里</p>
            <p>⛰ 山地：不能通行</p>
            <br>
            <p><strong>棋子大小：</strong></p>
            <p>司令 > 军长 > 师长 > 旅长 > 团长 > 营长 > 连长 > 排长 > 工兵</p>
            <p><strong>特殊：</strong></p>
            <p>🔸 炸弹：同归于尽</p>
            <p>🔸 地雷：只能工兵挖</p>
            <p>🔸 军旗：被扛走就输</p>
            <button class="btn-primary" onclick="closeModal('rulesModal')" style="margin-top: 15px;">知道了</button>
        </div>
    </div>
    
    <!-- 游戏结束模态框 -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 id="winnerText">🎉 游戏结束</h2>
            <button class="btn-primary" onclick="newGame()">再来一局</button>
            <button class="btn-secondary" onclick="closeModal('gameOverModal')">关闭</button>
        </div>
    </div>

    <script>
        const PIECE_RANK = {
            '司': 10, '军': 9, '师': 8, '旅': 7, '团': 6, '营': 5,
            '连': 4, '排': 3, '工': 2, '炸': 99, '雷': 1, '旗': 0
        };
        
        let board = [];
        let currentPlayer = null;
        let player1Color = null;
        let player2Color = null;
        let selectedCell = null;
        let firstFlip = true;
        
        // 标准军棋棋盘布局（5 行 12 列）
        // 行营位置
        const CAMP_POSITIONS = [
            {row: 1, col: 2}, {row: 1, col: 4}, {row: 1, col: 7}, {row: 1, col: 9},
            {row: 3, col: 2}, {row: 3, col: 4}, {row: 3, col: 7}, {row: 3, col: 9}
        ];
        
        // 大本营位置（军旗位）
        const BASE_POSITIONS = [
            {row: 0, col: 1}, {row: 0, col: 10},
            {row: 4, col: 1}, {row: 4, col: 10}
        ];
        
        // 山地位置（不能通行）
        const MOUNTAIN_POSITIONS = [
            {row: 2, col: 0}, {row: 2, col: 11},
            {row: 1, col: 5}, {row: 1, col: 6},
            {row: 3, col: 5}, {row: 3, col: 6}
        ];
        
        // 铁路线位置（上下两行，除去大本营和山地）
        const RAILWAY_POSITIONS = [];
        for (let j = 0; j < 12; j++) {
            if (!BASE_POSITIONS.some(p => p.row === 0 && p.col === j)) {
                RAILWAY_POSITIONS.push({row: 0, col: j});
            }
            if (!BASE_POSITIONS.some(p => p.row === 4 && p.col === j)) {
                RAILWAY_POSITIONS.push({row: 4, col: j});
            }
        }
        
        function getCellType(row, col) {
            if (CAMP_POSITIONS.some(p => p.row === row && p.col === col)) return 'camp';
            if (BASE_POSITIONS.some(p => p.row === row && p.col === col)) return 'base';
            if (MOUNTAIN_POSITIONS.some(p => p.row === row && p.col === col)) return 'mountain';
            if (RAILWAY_POSITIONS.some(p => p.row === row && p.col === col)) return 'railway';
            return 'normal';
        }
        
        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board = [];
            
            for (let i = 0; i < 5; i++) {
                board[i] = [];
                for (let j = 0; j < 12; j++) {
                    const cell = document.createElement('div');
                    const cellType = getCellType(i, j);
                    
                    cell.className = 'cell';
                    if (cellType === 'camp') cell.classList.add('camp');
                    else if (cellType === 'base') cell.classList.add('base');
                    else if (cellType === 'mountain') cell.classList.add('mountain');
                    else if (cellType === 'railway') cell.classList.add('railway');
                    
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.onclick = () => handleCellClick(i, j);
                    boardEl.appendChild(cell);
                    board[i][j] = { element: cell, piece: null, revealed: false, type: cellType };
                }
            }
        }
        
        function setupPieces() {
            const pieces = [
                { type: '司', color: 'red' }, { type: '军', color: 'red' },
                { type: '师', color: 'red' }, { type: '师', color: 'red' },
                { type: '旅', color: 'red' }, { type: '旅', color: 'red' },
                { type: '团', color: 'red' }, { type: '团', color: 'red' },
                { type: '营', color: 'red' }, { type: '营', color: 'red' },
                { type: '连', color: 'red' }, { type: '连', color: 'red' }, { type: '连', color: 'red' },
                { type: '排', color: 'red' }, { type: '排', color: 'red' }, { type: '排', color: 'red' },
                { type: '工', color: 'red' }, { type: '工', color: 'red' }, { type: '工', color: 'red' },
                { type: '炸', color: 'red' }, { type: '炸', color: 'red' },
                { type: '雷', color: 'red' }, { type: '雷', color: 'red' }, { type: '雷', color: 'red' },
                { type: '旗', color: 'red' },
                { type: '司', color: 'blue' }, { type: '军', color: 'blue' },
                { type: '师', color: 'blue' }, { type: '师', color: 'blue' },
                { type: '旅', color: 'blue' }, { type: '旅', color: 'blue' },
                { type: '团', color: 'blue' }, { type: '团', color: 'blue' },
                { type: '营', color: 'blue' }, { type: '营', color: 'blue' },
                { type: '连', color: 'blue' }, { type: '连', color: 'blue' }, { type: '连', color: 'blue' },
                { type: '排', color: 'blue' }, { type: '排', color: 'blue' }, { type: '排', color: 'blue' },
                { type: '工', color: 'blue' }, { type: '工', color: 'blue' }, { type: '工', color: 'blue' },
                { type: '炸', color: 'blue' }, { type: '炸', color: 'blue' },
                { type: '雷', color: 'blue' }, { type: '雷', color: 'blue' }, { type: '雷', color: 'blue' },
                { type: '旗', color: 'blue' }
            ];
            
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }
            
            const positions = [];
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 12; j++) {
                    const type = getCellType(i, j);
                    if (type !== 'mountain' && type !== 'camp') {
                        positions.push({row: i, col: j});
                    }
                }
            }
            
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }
            
            for (let i = 0; i < pieces.length; i++) {
                const pos = positions[i];
                board[pos.row][pos.col].piece = pieces[i];
            }
        }
        
        function handleCellClick(row, col) {
            const cell = board[row][col];
            
            if (cell.type === 'mountain') return;
            
            if (selectedCell) {
                if (row === selectedCell.row && col === selectedCell.col) {
                    clearSelection();
                    return;
                }
                
                if (!cell.revealed) {
                    movePiece(selectedCell.row, selectedCell.col, row, col);
                } else if (cell.piece && cell.piece.color !== currentPlayer) {
                    attack(selectedCell.row, selectedCell.col, row, col);
                }
                return;
            }
            
            if (!cell.revealed && cell.piece) {
                flipPiece(row, col);
            } else if (cell.revealed && cell.piece && cell.piece.color === currentPlayer) {
                selectPiece(row, col);
            }
        }
        
        function flipPiece(row, col) {
            const cell = board[row][col];
            cell.revealed = true;
            updateCellDisplay(row, col);
            
            if (firstFlip) {
                player1Color = cell.piece.color;
                player2Color = cell.piece.color === 'red' ? 'blue' : 'red';
                currentPlayer = player1Color;
                firstFlip = false;
                document.getElementById('currentPlayer').textContent = 
                    `${player1Color === 'red' ? '🔴 红方' : '🔵 蓝方'}先手，继续回合`;
                return;
            }
            
            currentPlayer = currentPlayer === player1Color ? player2Color : player1Color;
            updateGameInfo();
        }
        
        function selectPiece(row, col) {
            clearSelection();
            selectedCell = { row, col };
            board[row][col].element.classList.add('selected');
        }
        
        function clearSelection() {
            if (selectedCell) {
                board[selectedCell.row][selectedCell.col].element.classList.remove('selected');
                selectedCell = null;
            }
        }
        
        function movePiece(fromRow, fromCol, toRow, toCol) {
            const fromCell = board[fromRow][fromCol];
            const toCell = board[toRow][toCol];
            
            if (toCell.type === 'mountain') {
                alert('山地不能通行！');
                return;
            }
            
            const diffRow = Math.abs(fromRow - toRow);
            const diffCol = Math.abs(fromCol - toCol);
            
            if (diffRow + diffCol !== 1) {
                alert('只能移动到相邻的位置！');
                return;
            }
            
            toCell.piece = fromCell.piece;
            toCell.revealed = true;
            fromCell.piece = null;
            fromCell.revealed = false;
            
            updateCellDisplay(fromRow, fromCol);
            updateCellDisplay(toRow, toCol);
            
            clearSelection();
            
            if (toCell.piece.type === '旗') {
                endGame(currentPlayer === player1Color ? '玩家 1' : '玩家 2');
                return;
            }
            
            currentPlayer = currentPlayer === player1Color ? player2Color : player1Color;
            updateGameInfo();
        }
        
        function attack(fromRow, fromCol, toRow, toCol) {
            const fromCell = board[fromRow][fromCol];
            const toCell = board[toRow][toCol];
            const attacker = fromCell.piece;
            const defender = toCell.piece;
            
            if (toCell.type === 'mountain') {
                alert('山地不能攻击！');
                return;
            }
            
            const diffRow = Math.abs(fromRow - toRow);
            const diffCol = Math.abs(fromCol - toCol);
            
            if (diffRow + diffCol !== 1) {
                alert('只能攻击相邻的棋子！');
                return;
            }
            
            if (attacker.type === '炸' || defender.type === '炸') {
                fromCell.piece = null;
                toCell.piece = null;
            } else if (defender.type === '雷') {
                if (attacker.type === '工') {
                    toCell.piece = null;
                    fromCell.piece = attacker;
                } else {
                    fromCell.piece = null;
                }
            } else if (defender.type === '旗') {
                endGame(currentPlayer === player1Color ? '玩家 1' : '玩家 2');
                return;
            } else {
                const attackerRank = PIECE_RANK[attacker.type];
                const defenderRank = PIECE_RANK[defender.type];
                
                if (attackerRank > defenderRank) {
                    toCell.piece = attacker;
                    fromCell.piece = null;
                } else if (attackerRank < defenderRank) {
                    fromCell.piece = null;
                } else {
                    fromCell.piece = null;
                    toCell.piece = null;
                }
            }
            
            updateCellDisplay(fromRow, fromCol);
            updateCellDisplay(toRow, toCol);
            
            clearSelection();
            checkWinCondition();
            
            currentPlayer = currentPlayer === player1Color ? player2Color : player1Color;
            updateGameInfo();
        }
        
        function checkWinCondition() {
            let redHasFlag = false, blueHasFlag = false;
            let redCanMove = false, blueCanMove = false;
            
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 12; j++) {
                    const cell = board[i][j];
                    if (cell.revealed && cell.piece) {
                        if (cell.piece.color === 'red') {
                            if (cell.piece.type === '旗') redHasFlag = true;
                            redCanMove = true;
                        } else {
                            if (cell.piece.type === '旗') blueHasFlag = true;
                            blueCanMove = true;
                        }
                    }
                }
            }
            
            if (!redHasFlag || !redCanMove) {
                endGame(player1Color === 'blue' ? '玩家 1' : '玩家 2');
            } else if (!blueHasFlag || !blueCanMove) {
                endGame(player1Color === 'red' ? '玩家 1' : '玩家 2');
            }
        }
        
        function updateCellDisplay(row, col) {
            const cell = board[row][col];
            const el = cell.element;
            
            el.className = 'cell';
            if (cell.type === 'camp') el.classList.add('camp');
            else if (cell.type === 'base') el.classList.add('base');
            else if (cell.type === 'mountain') el.classList.add('mountain');
            else if (cell.type === 'railway') el.classList.add('railway');
            
            if (!cell.revealed || !cell.piece) {
                el.classList.add('back');
                el.textContent = '';
            } else {
                el.classList.add(cell.piece.color);
                el.textContent = cell.piece.type;
            }
        }
        
        function updateGameInfo() {
            const playerEl = document.getElementById('currentPlayer');
            if (!currentPlayer) {
                playerEl.textContent = '点击棋子开始游戏';
                return;
            }
            
            const currentName = currentPlayer === player1Color ? '玩家 1' : '玩家 2';
            const colorText = currentPlayer === 'red' ? '🔴 红方' : '🔵 蓝方';
            playerEl.textContent = `${colorText}（${currentName}）回合`;
        }
        
        function endGame(winner) {
            document.getElementById('winnerText').textContent = `🎉 ${winner}获胜！`;
            document.getElementById('gameOverModal').style.display = 'flex';
        }
        
        function newGame() {
            closeModal('gameOverModal');
            closeModal('shareModal');
            closeModal('rulesModal');
            
            currentPlayer = null;
            selectedCell = null;
            firstFlip = true;
            player1Color = null;
            player2Color = null;
            
            initBoard();
            setupPieces();
            document.getElementById('currentPlayer').textContent = '点击棋子开始游戏';
        }
        
        function showShareModal() {
            document.getElementById('shareLink').textContent = window.location.href;
            document.getElementById('shareModal').style.display = 'flex';
        }
        
        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('shareLink').textContent).then(() => {
                alert('链接已复制！');
            });
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        function showRules() {
            document.getElementById('rulesModal').style.display = 'flex';
        }
        
        newGame();
    </script>
