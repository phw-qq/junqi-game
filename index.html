<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>军棋翻翻棋 - 标准棋盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: #fff;
        }
        h1 { margin-bottom: 10px; font-size: 22px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .game-info {
            background: rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
        }
        .current-player { font-size: 1.1em; font-weight: bold; color: #ffd700; }
        
        .board-frame {
            background: linear-gradient(180deg, #8B7355 0%, #5C4033 100%);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 4px solid #3d2817;
        }
        
        /* 标准军棋棋盘：10 行 12 列 */
        .board {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 2px;
            background: #4a3728;
            padding: 8px;
            border-radius: 6px;
        }
        
        .cell {
            width: 32px;
            height: 32px;
            min-width: 32px;
            min-height: 32px;
            background: #d4c4a8;
            border: 1px solid #8b7355;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            user-select: none;
            position: relative;
            transition: all 0.2s;
        }
        
        /* 铁路线 */
        .cell.railway {
            background: repeating-linear-gradient(90deg, #e8dcc8 0px, #e8dcc8 6px, #c4b494 6px, #c4b494 8px);
        }
        
        /* 行营 - 圆形 */
        .cell.camp {
            background: radial-gradient(circle, #a8d8a8 0%, #78b878 100%);
            border-radius: 50%;
            border: 3px solid #589858;
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            margin: 2px;
        }
        
        /* 大本营 */
        .cell.base {
            background: #c8b898;
            border: 3px double #8b7355;
        }
        .cell.base::after {
            content: '★';
            position: absolute;
            font-size: 10px;
            color: #5c4033;
            top: 2px;
            right: 3px;
        }
        
        /* 前线界 */
        .cell.frontier {
            background: #b8a888;
            border: 2px solid #8b7355;
        }
        .cell.frontier::after {
            content: '界';
            font-size: 10px;
            color: #5c4033;
        }
        
        /* 山地 */
        .cell.mountain {
            background: linear-gradient(135deg, #6b8b5c 0%, #4b6b3c 100%);
        }
        .cell.mountain::after {
            content: '⛰';
            font-size: 16px;
        }
        
        .cell:hover {
            transform: scale(1.15);
            box-shadow: 0 0 12px rgba(255,255,255,0.6);
            z-index: 10;
        }
        
        .cell.red {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a) !important;
            color: white;
            border-color: #cc0000;
        }
        .cell.blue {
            background: linear-gradient(135deg, #4a90d9, #357abd) !important;
            color: white;
            border-color: #0066cc;
        }
        .cell.back {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: transparent;
            border-color: #654321;
        }
        .cell.back::after {
            content: '军';
            color: rgba(255,255,255,0.35);
            font-size: 16px;
        }
        .cell.selected {
            box-shadow: 0 0 18px #ffd700;
            transform: scale(1.2);
            z-index: 20;
            border: 3px solid #ffd700;
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245,87,108,0.4);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            margin: 20px;
        }
        .modal h2 { margin-bottom: 15px; color: #ffd700; font-size: 20px; }
        .modal p { margin: 10px 0; line-height: 1.6; }
        .share-link {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
        }
        
        @media (max-width: 450px) {
            .cell { width: 24px; height: 24px; min-width: 24px; min-height: 24px; font-size: 11px; }
            .cell.camp { width: 20px; height: 20px; min-width: 20px; min-height: 20px; }
            .board-frame { padding: 8px; }
            .board { padding: 4px; gap: 1px; }
            h1 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <h1>🎖️ 军棋翻翻棋</h1>
    <div class="game-info">
        <div class="current-player" id="currentPlayer">点击棋子开始游戏</div>
    </div>
    
    <div class="board-frame">
        <div class="board" id="board"></div>
    </div>
    
    <div class="controls">
        <button class="btn-primary" onclick="newGame()">新游戏</button>
        <button class="btn-secondary" onclick="showShareModal()">分享</button>
        <button class="btn-primary" onclick="showRules()">规则</button>
    </div>
    
    <div class="modal" id="shareModal">
        <div class="modal-content">
            <h2>🎮 邀请好友</h2>
            <p>复制链接发送给 QQ 好友：</p>
            <div class="share-link" id="shareLink"></div>
            <button class="btn-primary" onclick="copyLink()">复制</button>
            <button class="btn-secondary" onclick="closeModal('shareModal')">关闭</button>
        </div>
    </div>
    
    <div class="modal" id="rulesModal">
        <div class="modal-content">
            <h2>📜 游戏规则</h2>
            <p><strong>棋盘：</strong></p>
            <p>🛤 铁路线 - 工兵可任意移动</p>
            <p>⭕ 行营（12 个）- 安全区</p>
            <p>⭐ 大本营（2 个）- 军旗位</p>
            <p>⛰ 山地 - 不可通行</p>
            <p>📍 前线界 - 中线分界</p>
            <br>
            <p><strong>棋子大小：</strong></p>
            <p>司令 > 军长 > 师长 > 旅长 > 团长 > 营长 > 连长 > 排长 > 工兵</p>
            <p><strong>特殊：</strong></p>
            <p>🔸 炸弹：同归于尽</p>
            <p>🔸 地雷：只能工兵挖</p>
            <p>🔸 军旗：被扛走就输</p>
            <button class="btn-primary" onclick="closeModal('rulesModal')" style="margin-top:15px;">知道了</button>
        </div>
    </div>
    
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 id="winnerText">🎉 游戏结束</h2>
            <button class="btn-primary" onclick="newGame()">再来一局</button>
            <button class="btn-secondary" onclick="closeModal('gameOverModal')">关闭</button>
        </div>
    </div>

    <script>
        const PIECE_RANK = {
            '司': 10, '军': 9, '师': 8, '旅': 7, '团': 6, '营': 5,
            '连': 4, '排': 3, '工': 2, '炸': 99, '雷': 1, '旗': 0
        };
        
        let board = [], currentPlayer = null, player1Color = null, player2Color = null;
        let selectedCell = null, firstFlip = true;
        
        // 10 行 12 列标准军棋棋盘
        // 行营位置（12 个）- 顶部 6 个 + 底部 6 个，金字塔分布
        const CAMPS_TOP = [[1,3],[1,4],[1,7],[1,8],[2,4],[2,7]];
        const CAMPS_BOTTOM = [[7,4],[7,7],[8,3],[8,4],[8,7],[8,8]];
        const CAMPS = [...CAMPS_TOP, ...CAMPS_BOTTOM];
        
        // 大本营（2 个）- 左右各一个
        const BASES = [[0,5],[0,6]];
        
        // 前线界（中线）
        const FRONTIERS = [[4,5],[4,6],[5,5],[5,6]];
        
        // 山地
        const MOUNTAINS = [[2,2],[2,9],[7,2],[7,9]];
        
        // 铁路线（上下两行）
        const RAILWAYS = [];
        for(let j=0; j<12; j++) RAILWAYS.push([0,j]);
        for(let j=0; j<12; j++) RAILWAYS.push([9,j]);
        
        function getType(r,c) {
            if (CAMPS.some(p=>p[0]===r&&p[1]===c)) return 'camp';
            if (BASES.some(p=>p[0]===r&&p[1]===c)) return 'base';
            if (FRONTIERS.some(p=>p[0]===r&&p[1]===c)) return 'frontier';
            if (MOUNTAINS.some(p=>p[0]===r&&p[1]===c)) return 'mountain';
            if (RAILWAYS.some(p=>p[0]===r&&p[1]===c)) return 'railway';
            return 'normal';
        }
        
        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board = [];
            for (let i=0; i<10; i++) {
                board[i] = [];
                for (let j=0; j<12; j++) {
                    const cell = document.createElement('div');
                    const t = getType(i,j);
                    cell.className = 'cell' + (t==='camp'?' camp':t==='base'?' base':t==='frontier'?' frontier':t==='mountain'?' mountain':t==='railway'?' railway':'');
                    cell.dataset.row = i; cell.dataset.col = j;
                    cell.onclick = () => handleCellClick(i,j);
                    boardEl.appendChild(cell);
                    board[i][j] = {element:cell, piece:null, revealed:false, type:t};
                }
            }
        }
        
        function setupPieces() {
            const pieces = [
                {type:'司',color:'red'},{type:'军',color:'red'},{type:'师',color:'red'},{type:'师',color:'red'},
                {type:'旅',color:'red'},{type:'旅',color:'red'},{type:'团',color:'red'},{type:'团',color:'red'},
                {type:'营',color:'red'},{type:'营',color:'red'},{type:'连',color:'red'},{type:'连',color:'red'},{type:'连',color:'red'},
                {type:'排',color:'red'},{type:'排',color:'red'},{type:'排',color:'red'},
                {type:'工',color:'red'},{type:'工',color:'red'},{type:'工',color:'red'},
                {type:'炸',color:'red'},{type:'炸',color:'red'},
                {type:'雷',color:'red'},{type:'雷',color:'red'},{type:'雷',color:'red'},{type:'旗',color:'red'},
                {type:'司',color:'blue'},{type:'军',color:'blue'},{type:'师',color:'blue'},{type:'师',color:'blue'},
                {type:'旅',color:'blue'},{type:'旅',color:'blue'},{type:'团',color:'blue'},{type:'团',color:'blue'},
                {type:'营',color:'blue'},{type:'营',color:'blue'},{type:'连',color:'blue'},{type:'连',color:'blue'},{type:'连',color:'blue'},
                {type:'排',color:'blue'},{type:'排',color:'blue'},{type:'排',color:'blue'},
                {type:'工',color:'blue'},{type:'工',color:'blue'},{type:'工',color:'blue'},
                {type:'炸',color:'blue'},{type:'炸',color:'blue'},
                {type:'雷',color:'blue'},{type:'雷',color:'blue'},{type:'雷',color:'blue'},{type:'旗',color:'blue'}
            ];
            for (let i=pieces.length-1; i>0; i--) {
                const j = Math.floor(Math.random()*(i+1));
                [pieces[i],pieces[j]] = [pieces[j],pieces[i]];
            }
            const positions = [];
            for (let i=0; i<10; i++) for (let j=0; j<12; j++) {
                const t = getType(i,j);
                if (t!=='mountain' && t!=='camp' && t!=='frontier') positions.push([i,j]);
            }
            for (let i=positions.length-1; i>0; i--) {
                const j = Math.floor(Math.random()*(i+1));
                [positions[i],positions[j]] = [positions[j],positions[i]];
            }
            for (let i=0; i<pieces.length; i++) {
                const [r,c] = positions[i];
                board[r][c].piece = pieces[i];
            }
        }
        
        function handleCellClick(r,c) {
            const cell = board[r][c];
            if (cell.type==='mountain' || cell.type==='frontier') return;
            if (selectedCell) {
                if (r===selectedCell.r && c===selectedCell.c) { clearSelection(); return; }
                if (!cell.revealed) movePiece(selectedCell.r,selectedCell.c,r,c);
                else if (cell.piece && cell.piece.color!==currentPlayer) attack(selectedCell.r,selectedCell.c,r,c);
                return;
            }
            if (!cell.revealed && cell.piece) flipPiece(r,c);
            else if (cell.revealed && cell.piece && cell.piece.color===currentPlayer) selectPiece(r,c);
        }
        
        function flipPiece(r,c) {
            const cell = board[r][c];
            cell.revealed = true;
            updateCellDisplay(r,c);
            if (firstFlip) {
                player1Color = cell.piece.color;
                player2Color = cell.piece.color==='red'?'blue':'red';
                currentPlayer = player1Color;
                firstFlip = false;
                document.getElementById('currentPlayer').textContent = `${player1Color==='red'?'🔴红方':'🔵蓝方'}先手，继续回合`;
                return;
            }
            currentPlayer = currentPlayer===player1Color?player2Color:player1Color;
            updateGameInfo();
        }
        
        function selectPiece(r,c) { clearSelection(); selectedCell={r,c}; board[r][c].element.classList.add('selected'); }
        function clearSelection() { if(selectedCell) { board[selectedCell.r][selectedCell.c].element.classList.remove('selected'); selectedCell=null; } }
        
        function movePiece(fr,fc,tr,tc) {
            const from=board[fr][fc], to=board[tr][tc];
            if (to.type==='mountain' || to.type==='frontier') { alert('不能走到这里！'); return; }
            if (Math.abs(fr-tr)+Math.abs(fc-tc)!==1) { alert('只能走相邻位置！'); return; }
            to.piece=from.piece; to.revealed=true; from.piece=null; from.revealed=false;
            updateCellDisplay(fr,fc); updateCellDisplay(tr,tc); clearSelection();
            if (to.piece.type==='旗') { endGame(currentPlayer===player1Color?'玩家 1':'玩家 2'); return; }
            currentPlayer=currentPlayer===player1Color?player2Color:player1Color;
            updateGameInfo();
        }
        
        function attack(fr,fc,tr,tc) {
            const from=board[fr][fc], to=board[tr][tc];
            const atk=from.piece, def=to.piece;
            if (to.type==='mountain' || to.type==='frontier') { alert('不能攻击这里！'); return; }
            if (Math.abs(fr-tr)+Math.abs(fc-tc)!==1) { alert('只能攻击相邻位置！'); return; }
            if (atk.type==='炸'||def.type==='炸') { from.piece=null; to.piece=null; }
            else if (def.type==='雷') { if(atk.type==='工'){to.piece=null;from.piece=atk;} else from.piece=null; }
            else if (def.type==='旗') { endGame(currentPlayer===player1Color?'玩家 1':'玩家 2'); return; }
            else {
                const ar=PIECE_RANK[atk.type], dr=PIECE_RANK[def.type];
                if (ar>dr) { to.piece=atk; from.piece=null; }
                else if (ar<dr) from.piece=null;
                else { from.piece=null; to.piece=null; }
            }
            updateCellDisplay(fr,fc); updateCellDisplay(tr,tc); clearSelection();
            checkWin();
            currentPlayer=currentPlayer===player1Color?player2Color:player1Color;
            updateGameInfo();
        }
        
        function checkWin() {
            let rf=false,bf=false,rm=false,bm=false;
            for(let i=0;i<10;i++) for(let j=0;j<12;j++) {
                const c=board[i][j];
                if(c.revealed&&c.piece) {
                    if(c.piece.color==='red') { if(c.piece.type==='旗')rf=true; rm=true; }
                    else { if(c.piece.type==='旗')bf=true; bm=true; }
                }
            }
            if(!rf||!rm) endGame(player1Color==='blue'?'玩家 1':'玩家 2');
            else if(!bf||!bm) endGame(player1Color==='red'?'玩家 1':'玩家 2');
        }
        
        function updateCellDisplay(r,c) {
            const cell=board[r][c], el=cell.element;
            el.className='cell';
            if(cell.type==='camp')el.classList.add('camp');
            else if(cell.type==='base')el.classList.add('base');
            else if(cell.type==='frontier')el.classList.add('frontier');
            else if(cell.type==='mountain')el.classList.add('mountain');
            else if(cell.type==='railway')el.classList.add('railway');
            if(!cell.revealed||!cell.piece) { el.classList.add('back'); el.textContent=''; }
            else { el.classList.add(cell.piece.color); el.textContent=cell.piece.type; }
        }
        
        function updateGameInfo() {
            const el=document.getElementById('currentPlayer');
            if(!currentPlayer) { el.textContent='点击棋子开始游戏'; return; }
            const nm=currentPlayer===player1Color?'玩家 1':'玩家 2';
            const ct=currentPlayer==='red'?'🔴红方':'🔵蓝方';
            el.textContent=`${ct}（${nm}）回合`;
        }
        
        function endGame(winner) {
            document.getElementById('winnerText').textContent=`🎉 ${winner}获胜！`;
            document.getElementById('gameOverModal').style.display='flex';
        }
        
        function newGame() {
            closeModal('gameOverModal');closeModal('shareModal');closeModal('rulesModal');
            currentPlayer=null;selectedCell=null;firstFlip=true;player1Color=null;player2Color=null;
            initBoard();setupPieces();
            document.getElementById('currentPlayer').textContent='点击棋子开始游戏';
        }
        
        function showShareModal() { document.getElementById('shareLink').textContent=window.location.href; document.getElementById('shareModal').style.display='flex'; }
        function copyLink() { navigator.clipboard.writeText(document.getElementById('shareLink').textContent).then(()=>alert('已复制！')); }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function showRules() { document.getElementById('rulesModal').style.display='flex'; }
        
        newGame();
    </script>
</body>
</html>
