<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>军棋翻翻棋 - 双人对弈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: #fff;
        }
        
        h1 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 22px;
        }
        
        .game-info {
            background: rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .current-player {
            font-size: 1.1em;
            font-weight: bold;
            color: #ffd700;
        }
        
        /* 标准军棋棋盘：5 行 12 列 */
        .board {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 2px;
            background: #3d6016;
            padding: 6px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
            overflow-x: auto;
        }
        
        .cell {
            width: 32px;
            height: 32px;
            min-width: 32px;
            min-height: 32px;
            background: #90EE90;
            border: 2px solid #228B22;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
            position: relative;
        }
        
        /* 行营位置（圆形）*/
        .cell.camp {
            background: #7CB342;
            border-radius: 50%;
            border: 2px dashed #558B2F;
        }
        
        /* 大本营位置 */
        .cell.base {
            background: #558B2F;
            border: 2px solid #33691E;
        }
        
        .cell:hover {
            transform: scale(1.08);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            z-index: 10;
        }
        
        .cell.red {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            border-color: #cc0000;
        }
        
        .cell.blue {
            background: linear-gradient(135deg, #4a90d9, #357abd);
            color: white;
            border-color: #0066cc;
        }
        
        .cell.back {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: transparent;
            border-color: #654321;
        }
        
        .cell.back::after {
            content: '军';
            color: rgba(255,255,255,0.3);
            font-size: 16px;
        }
        
        .cell.selected {
            box-shadow: 0 0 15px #ffd700;
            transform: scale(1.15);
            z-index: 20;
            border: 3px solid #ffd700;
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245,87,108,0.4);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 380px;
            margin: 20px;
        }
        
        .modal h2 {
            margin-bottom: 15px;
            color: #ffd700;
            font-size: 20px;
        }
        
        .modal p {
            margin: 10px 0;
            line-height: 1.6;
        }
        
        .share-link {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
        }
        
        @media (max-width: 450px) {
            .cell {
                width: 26px;
                height: 26px;
                min-width: 26px;
                min-height: 26px;
                font-size: 12px;
            }
            
            .board {
                gap: 1px;
                padding: 4px;
            }
            
            h1 {
                font-size: 18px;
            }
            
            .game-info {
                padding: 8px 12px;
            }
            
            .current-player {
                font-size: 0.95em;
            }
            
            .controls button {
                padding: 8px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <h1>🎖️ 军棋翻翻棋</h1>
    
    <div class="game-info">
        <div class="current-player" id="currentPlayer">点击棋子开始游戏</div>
        <div id="gameStatus" style="margin-top: 8px; font-size: 0.9em;"></div>
    </div>
    
    <div class="board" id="board"></div>
    
    <div class="controls">
        <button class="btn-primary" onclick="newGame()">新游戏</button>
        <button class="btn-secondary" onclick="showShareModal()">分享</button>
        <button class="btn-primary" onclick="showRules()">规则</button>
    </div>
    
    <!-- 分享模态框 -->
    <div class="modal" id="shareModal">
        <div class="modal-content">
            <h2>🎮 邀请好友</h2>
            <p>复制链接发送给 QQ 好友：</p>
            <div class="share-link" id="shareLink"></div>
            <button class="btn-primary" onclick="copyLink()">复制</button>
            <button class="btn-secondary" onclick="closeModal('shareModal')">关闭</button>
        </div>
    </div>
    
    <!-- 规则模态框 -->
    <div class="modal" id="rulesModal">
        <div class="modal-content">
            <h2>📜 游戏规则</h2>
            <p><strong>棋子大小：</strong></p>
            <p>司令 > 军长 > 师长 > 旅长 > 团长 > 营长 > 连长 > 排长 > 工兵</p>
            <p><strong>特殊：</strong></p>
            <p>🔸 炸弹：同归于尽</p>
            <p>🔸 地雷：只能工兵挖</p>
            <p>🔸 军旗：被扛走就输</p>
            <p><strong>操作：</strong></p>
            <p>点击背面棋子翻开，点击己方棋子选中，再点击相邻位置移动/攻击</p>
            <button class="btn-primary" onclick="closeModal('rulesModal')" style="margin-top: 15px;">知道了</button>
        </div>
    </div>
    
    <!-- 游戏结束模态框 -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 id="winnerText">🎉 游戏结束</h2>
            <button class="btn-primary" onclick="newGame()">再来一局</button>
            <button class="btn-secondary" onclick="closeModal('gameOverModal')">关闭</button>
        </div>
    </div>

    <script>
        // 棋子大小等级
        const PIECE_RANK = {
            '司': 10, '军': 9, '师': 8, '旅': 7, '团': 6, '营': 5,
            '连': 4, '排': 3, '工': 2, '炸': 99, '雷': 1, '旗': 0
        };
        
        let board = [];
        let currentPlayer = null;  // null 表示还没确定
        let player1Color = null;
        let player2Color = null;
        let selectedCell = null;
        let redFlagPos = null;
        let blueFlagPos = null;
        let firstFlip = true;  // 是否是第一次翻棋
        
        // 标准军棋棋盘布局（5 行 12 列）
        // 行营位置：(1,2), (1,4), (1,7), (1,9), (3,2), (3,4), (3,7), (3,9)
        // 大本营位置：(0,1), (0,10), (4,1), (4,10)
        const CAMP_POSITIONS = [
            {row: 1, col: 2}, {row: 1, col: 4}, {row: 1, col: 7}, {row: 1, col: 9},
            {row: 3, col: 2}, {row: 3, col: 4}, {row: 3, col: 7}, {row: 3, col: 9}
        ];
        
        const BASE_POSITIONS = [
            {row: 0, col: 1}, {row: 0, col: 10},
            {row: 4, col: 1}, {row: 4, col: 10}
        ];
        
        function isCamp(row, col) {
            return CAMP_POSITIONS.some(pos => pos.row === row && pos.col === col);
        }
        
        function isBase(row, col) {
            return BASE_POSITIONS.some(pos => pos.row === row && pos.col === col);
        }
        
        // 初始化棋盘
        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board = [];
            
            for (let i = 0; i < 5; i++) {
                board[i] = [];
                for (let j = 0; j < 12; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell back';
                    
                    // 标记特殊位置
                    if (isCamp(i, j)) {
                        cell.classList.add('camp');
                    } else if (isBase(i, j)) {
                        cell.classList.add('base');
                    }
                    
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.onclick = () => handleCellClick(i, j);
                    boardEl.appendChild(cell);
                    board[i][j] = { element: cell, piece: null, revealed: false };
                }
            }
        }
        
        // 布置棋子（50 个棋子，60 个位置，空 10 个）
        function setupPieces() {
            const pieces = [
                // 红方 25 子
                { type: '司', color: 'red' }, { type: '军', color: 'red' },
                { type: '师', color: 'red' }, { type: '师', color: 'red' },
                { type: '旅', color: 'red' }, { type: '旅', color: 'red' },
                { type: '团', color: 'red' }, { type: '团', color: 'red' },
                { type: '营', color: 'red' }, { type: '营', color: 'red' },
                { type: '连', color: 'red' }, { type: '连', color: 'red' }, { type: '连', color: 'red' },
                { type: '排', color: 'red' }, { type: '排', color: 'red' }, { type: '排', color: 'red' },
                { type: '工', color: 'red' }, { type: '工', color: 'red' }, { type: '工', color: 'red' },
                { type: '炸', color: 'red' }, { type: '炸', color: 'red' },
                { type: '雷', color: 'red' }, { type: '雷', color: 'red' }, { type: '雷', color: 'red' },
                { type: '旗', color: 'red' },
                // 蓝方 25 子
                { type: '司', color: 'blue' }, { type: '军', color: 'blue' },
                { type: '师', color: 'blue' }, { type: '师', color: 'blue' },
                { type: '旅', color: 'blue' }, { type: '旅', color: 'blue' },
                { type: '团', color: 'blue' }, { type: '团', color: 'blue' },
                { type: '营', color: 'blue' }, { type: '营', color: 'blue' },
                { type: '连', color: 'blue' }, { type: '连', color: 'blue' }, { type: '连', color: 'blue' },
                { type: '排', color: 'blue' }, { type: '排', color: 'blue' }, { type: '排', color: 'blue' },
                { type: '工', color: 'blue' }, { type: '工', color: 'blue' }, { type: '工', color: 'blue' },
                { type: '炸', color: 'blue' }, { type: '炸', color: 'blue' },
                { type: '雷', color: 'blue' }, { type: '雷', color: 'blue' }, { type: '雷', color: 'blue' },
                { type: '旗', color: 'blue' }
            ];
            
            // 洗牌
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }
            
            // 随机选择 50 个位置放置棋子
            const positions = [];
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 12; j++) {
                    positions.push({row: i, col: j});
                }
            }
            
            // 打乱位置
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }
            
            // 放置棋子
            for (let i = 0; i < pieces.length; i++) {
                const pos = positions[i];
                board[pos.row][pos.col].piece = pieces[i];
                if (pieces[i].type === '旗') {
                    if (pieces[i].color === 'red') redFlagPos = {row: pos.row, col: pos.col};
                    else blueFlagPos = {row: pos.row, col: pos.col};
                }
            }
        }
        
        // 处理点击
        function handleCellClick(row, col) {
            const cell = board[row][col];
            
            // 如果已选中棋子，尝试移动
            if (selectedCell) {
                if (row === selectedCell.row && col === selectedCell.col) {
                    clearSelection();
                    return;
                }
                
                // 尝试移动或攻击
                if (!cell.revealed) {
                    movePiece(selectedCell.row, selectedCell.col, row, col);
                } else if (cell.piece && cell.piece.color !== currentPlayer) {
                    attack(selectedCell.row, selectedCell.col, row, col);
                }
                return;
            }
            
            // 翻开棋子或选择己方棋子
            if (!cell.revealed && cell.piece) {
                flipPiece(row, col);
            } else if (cell.revealed && cell.piece && cell.piece.color === currentPlayer) {
                selectPiece(row, col);
            }
        }
        
        // 翻开棋子
        function flipPiece(row, col) {
            const cell = board[row][col];
            cell.revealed = true;
            updateCellDisplay(row, col);
            
            // 第一次翻棋，确定玩家颜色
            if (firstFlip) {
                player1Color = cell.piece.color;
                player2Color = cell.piece.color === 'red' ? 'blue' : 'red';
                currentPlayer = player1Color;
                firstFlip = false;
                document.getElementById('currentPlayer').textContent = 
                    `红方先翻，${player1Color === 'red' ? '翻到红方' : '翻到蓝方'}，继续回合`;
                return;  // 第一次翻棋后不切换玩家
            }
            
            // 切换玩家
            currentPlayer = currentPlayer === player1Color ? player2Color : player1Color;
            updateGameInfo();
        }
        
        // 选择棋子
        function selectPiece(row, col) {
            clearSelection();
            selectedCell = { row, col };
            board[row][col].element.classList.add('selected');
        }
        
        // 清除选择
        function clearSelection() {
            if (selectedCell) {
                board[selectedCell.row][selectedCell.col].element.classList.remove('selected');
                selectedCell = null;
            }
        }
        
        // 移动棋子
        function movePiece(fromRow, fromCol, toRow, toCol) {
            const fromCell = board[fromRow][fromCol];
            const toCell = board[toRow][toCol];
            
            // 检查是否是相邻移动（上下左右）
            const diffRow = Math.abs(fromRow - toRow);
            const diffCol = Math.abs(fromCol - toCol);
            
            if (diffRow + diffCol !== 1) {
                alert('只能移动到相邻的位置！');
                return;
            }
            
            // 行营不能停留（可选规则，这里允许）
            
            // 移动
            toCell.piece = fromCell.piece;
            toCell.revealed = true;
            fromCell.piece = null;
            fromCell.revealed = false;
            
            updateCellDisplay(fromRow, fromCol);
            updateCellDisplay(toRow, toCol);
            
            clearSelection();
            
            // 检查是否扛旗
            if (toCell.piece.type === '旗') {
                endGame(currentPlayer === player1Color ? '玩家 1' : '玩家 2');
                return;
            }
            
            // 切换玩家
            currentPlayer = currentPlayer === player1Color ? player2Color : player1Color;
            updateGameInfo();
        }
        
        // 攻击
        function attack(fromRow, fromCol, toRow, toCol) {
            const fromCell = board[fromRow][fromCol];
            const toCell = board[toRow][toCol];
            const attacker = fromCell.piece;
            const defender = toCell.piece;
            
            const diffRow = Math.abs(fromRow - toRow);
            const diffCol = Math.abs(fromCol - toCol);
            
            if (diffRow + diffCol !== 1) {
                alert('只能攻击相邻的棋子！');
                return;
            }
            
            let result = '';
            
            // 处理炸弹
            if (attacker.type === '炸' || defender.type === '炸') {
                fromCell.piece = null;
                toCell.piece = null;
                result = '同归于尽！';
            }
            // 处理地雷
            else if (defender.type === '雷') {
                if (attacker.type === '工') {
                    toCell.piece = null;
                    fromCell.piece = attacker;
                    result = '工兵排雷！';
                } else {
                    fromCell.piece = null;
                    result = '撞雷了！';
                }
            }
            // 处理军旗
            else if (defender.type === '旗') {
                endGame(currentPlayer === player1Color ? '玩家 1' : '玩家 2');
                return;
            }
            // 正常战斗
            else {
                const attackerRank = PIECE_RANK[attacker.type];
                const defenderRank = PIECE_RANK[defender.type];
                
                if (attackerRank > defenderRank) {
                    toCell.piece = attacker;
                    fromCell.piece = null;
                    result = '胜利！';
                } else if (attackerRank < defenderRank) {
                    fromCell.piece = null;
                    result = '失败！';
                } else {
                    fromCell.piece = null;
                    toCell.piece = null;
                    result = '同归于尽！';
                }
            }
            
            updateCellDisplay(fromRow, fromCol);
            updateCellDisplay(toRow, toCol);
            
            clearSelection();
            checkWinCondition();
            
            currentPlayer = currentPlayer === player1Color ? player2Color : player1Color;
            updateGameInfo();
        }
        
        // 检查胜利条件
        function checkWinCondition() {
            let redHasFlag = false;
            let blueHasFlag = false;
            let redCanMove = false;
            let blueCanMove = false;
            
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 12; j++) {
                    const cell = board[i][j];
                    if (cell.revealed && cell.piece) {
                        if (cell.piece.color === 'red') {
                            if (cell.piece.type === '旗') redHasFlag = true;
                            redCanMove = true;
                        } else {
                            if (cell.piece.type === '旗') blueHasFlag = true;
                            blueCanMove = true;
                        }
                    }
                }
            }
            
            if (!redHasFlag) {
                endGame(player1Color === 'blue' ? '玩家 1' : '玩家 2');
            } else if (!blueHasFlag) {
                endGame(player1Color === 'red' ? '玩家 1' : '玩家 2');
            } else if (!redCanMove) {
                endGame(player1Color === 'blue' ? '玩家 1' : '玩家 2');
            } else if (!blueCanMove) {
                endGame(player1Color === 'red' ? '玩家 1' : '玩家 2');
            }
        }
        
        // 更新单元格显示
        function updateCellDisplay(row, col) {
            const cell = board[row][col];
            const el = cell.element;
            
            el.className = 'cell';
            
            if (isCamp(row, col)) el.classList.add('camp');
            else if (isBase(row, col)) el.classList.add('base');
            
            if (!cell.revealed || !cell.piece) {
                el.classList.add('back');
                el.textContent = '';
            } else {
                el.classList.add(cell.piece.color);
                el.textContent = cell.piece.type;
            }
        }
        
        // 更新游戏信息
        function updateGameInfo() {
            const playerEl = document.getElementById('currentPlayer');
            if (!currentPlayer) {
                playerEl.textContent = '点击棋子开始游戏';
                return;
            }
            
            const currentName = currentPlayer === player1Color ? '玩家 1' : '玩家 2';
            const colorText = currentPlayer === 'red' ? '🔴 红方' : '🔵 蓝方';
            playerEl.textContent = `${colorText}（${currentName}）回合`;
            playerEl.style.color = currentPlayer === 'red' ? '#ff6b6b' : '#4a90d9';
        }
        
        // 结束游戏
        function endGame(winner) {
            document.getElementById('winnerText').textContent = `🎉 ${winner}获胜！`;
            document.getElementById('gameOverModal').style.display = 'flex';
        }
        
        // 新游戏
        function newGame() {
            closeModal('gameOverModal');
            closeModal('shareModal');
            closeModal('rulesModal');
            
            currentPlayer = null;
            selectedCell = null;
            firstFlip = true;
            player1Color = null;
            player2Color = null;
            redFlagPos = null;
            blueFlagPos = null;
            
            initBoard();
            setupPieces();
            document.getElementById('currentPlayer').textContent = '点击棋子开始游戏';
        }
        
        // 显示分享模态框
        function showShareModal() {
            const link = window.location.href;
            document.getElementById('shareLink').textContent = link;
            document.getElementById('shareModal').style.display = 'flex';
        }
        
        // 复制链接
        function copyLink() {
            const link = document.getElementById('shareLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                alert('链接已复制！发送给 QQ 好友即可邀请对战');
            });
        }
        
        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        // 显示规则
        function showRules() {
            document.getElementById('rulesModal').style.display = 'flex';
        }
        
        // 初始化游戏
        newGame();
    </script>
</body>
</html>
